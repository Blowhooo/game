<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>길가식당</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1a17; color: #f2e8d8;
    font-family: sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; }
  .bar { position: fixed; left: 0; right: 0; display: flex; align-items: center; gap: 8px;
    padding: 8px max(12px, env(safe-area-inset-left)); pointer-events: none; }
  .bar > * { pointer-events: auto; }
  #top { top: 0; font-size: 14px; white-space: pre; text-shadow: 0 1px 2px #000, 0 0 4px #000; }
  #bottom { bottom: 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  #seeds { display: flex; gap: 6px; }
  #mapKey { font-size: 13px; text-shadow: 0 1px 2px #000; }
  #bottom .gap { flex: 1; pointer-events: none; }
  button { min-width: 56px; min-height: 44px; padding: 0 12px; border: 2px solid #5a4636; border-radius: 8px;
    background: #2b231dcc; color: #f2e8d8; font-size: 15px; }
  button .key { display: none; margin-right: 4px; opacity: .6; }
  @media (pointer: fine) { button .key { display: inline; } }
  button.on { border-color: #ffd76a; color: #ffd76a; font-weight: bold; }
  #goal { position: fixed; top: 8px; right: max(12px, env(safe-area-inset-right)); max-width: 45%; text-align: right; font-size: 14px;
    color: #ffd76a; text-shadow: 0 1px 2px #000, 0 0 4px #000; pointer-events: none; }
  #msg { position: fixed; top: 40px; left: 0; right: 0; text-align: center; color: #ffd76a;
    text-shadow: 0 1px 2px #000; pointer-events: none; }
  #hint { position: fixed; bottom: 64px; left: 0; right: 0; text-align: center; font-size: 13px; color: #fff8ec;
    text-shadow: 0 1px 2px #000, 0 0 4px #000; pointer-events: none; }
  #night { display: none; position: fixed; inset: 0; background: #0d0b14e6; flex-direction: column; gap: 8px;
    align-items: center; justify-content: safe center; font-size: 16px; line-height: 1.5; text-align: center; z-index: 5;
    padding: 12px; box-sizing: border-box; overflow-y: auto; }
  #night.on { display: flex; }
  #nightArt { position: static; flex: none; height: min(192px, 30vh); aspect-ratio: 5 / 3; image-rendering: pixelated; }
  #nightDay { font-size: 14px; opacity: .7; }
  /* 대화창: 화면 아래, 얼굴 · 이름 · 대사. 아무 데나 누르면 다음 */
  #story { display: none; position: fixed; inset: 0; background: #0d0b1466; z-index: 7; align-items: flex-end; justify-content: center;
    padding: 0 12px max(12px, env(safe-area-inset-bottom)); box-sizing: border-box; cursor: pointer; }
  #story.on { display: flex; }
  #talkBox { position: relative; display: flex; gap: 14px; align-items: flex-start; width: 100%; max-width: 860px; min-height: 120px;
    padding: 14px 40px 14px 14px; box-sizing: border-box; background: #2b231df2; border: 3px solid #5a4636; border-radius: 10px; }
  #talkFace { flex: none; width: 96px; height: 96px; border-radius: 6px; border: 2px solid #5a4636; display: flex;
    align-items: center; justify-content: center; font-size: 40px; font-weight: bold; color: #fff8ec; overflow: hidden; }
  #talkFace img { width: 100%; height: 100%; object-fit: cover; }
  #talkName { color: #ffd76a; font-weight: bold; margin-bottom: 6px; }
  #talkText { font-size: 17px; line-height: 1.6; }
  #talkBox.narration { justify-content: center; text-align: center; font-style: italic; color: #d8cbb8; }
  #talkBox.narration > div:not(#talkMore) { flex: 1; }
  #talkMore { position: absolute; right: 14px; bottom: 10px; color: #ffd76a; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #store { display: none; position: fixed; inset: 0; background: #1e1a17ee; flex-direction: column; gap: 12px;
    align-items: center; justify-content: safe center; z-index: 6; padding: 12px; box-sizing: border-box; overflow-y: auto; }
  #store.on { display: flex; }
  #storeList { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 720px; }
  #storeList button { min-width: 180px; padding: 8px 12px; line-height: 1.4; }
  button:disabled { opacity: .4; }
  #nightNews { color: #ffd76a; }
  #night button.small { min-height: 32px; font-size: 12px; opacity: .5; }
  #top { line-height: 1.5; }
  #rotate { display: none; position: fixed; inset: 0; background: #1e1a17; align-items: center;
    justify-content: center; font-size: 18px; z-index: 9; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="top" class="bar"></div>
<div id="goal"></div>
<div id="msg"></div>
<div id="hint"></div>
<div id="bottom" class="bar">
  <div id="seeds"></div>
  <div class="gap"></div>
  <span id="mapKey" style="display:none"><b style="color:#7fb2ff">●</b> 나 <b style="color:#f2a8c0">●</b> 아내 <b style="color:#fff4b0">●</b> A <b style="color:#ffd76a">●</b> 지나가는 사람</span>
  <button id="mapBtn">지도</button>
  <button id="restBtn">오늘은 쉬자</button>
  <button id="endBtn">하루 마치기</button>
</div>
<div id="night"><div id="nightDay"></div><canvas id="nightArt" width="80" height="48"></canvas><div id="nightText"></div><div id="nightNews"></div><button id="nextDay">다음 날</button><button id="resetBtn" class="small">처음부터 다시</button></div>
<div id="story"><div id="talkBox"><div id="talkFace"></div><div><div id="talkName"></div><div id="talkText"></div></div><div id="talkMore">▼</div></div></div>
<div id="store"><div id="storeTitle"></div><div id="storeList"></div><button id="storeClose">나가기</button></div>
<div id="rotate">가로로 돌려 주세요</div>

</html>
